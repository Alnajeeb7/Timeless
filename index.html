<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a07">
<title>GATE 2027 | Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #0b150d; --bg2: #030604; --g: #7fc46b; --g2: #4f8a47; --dim: #2c4330; --fg: #e6efe0;
  --serif: "Cinzel", "Trajan Pro", "Palatino Linotype", Georgia, serif;
  --mono: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg1), var(--bg2));
  color: var(--fg); font-family: var(--serif); display: flex;
  padding: 2.5vh 20px; text-align: center; overflow-x: hidden; overflow-y: auto;
}
#leaves { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.7));
}
main { width: 100%; max-width: 520px; margin: auto; position: relative; z-index: 2; }
#snd {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 5;
  background: rgba(5,10,7,.7); color: var(--g); border: 1px solid var(--g2);
  font-family: var(--mono); font-size: 12px; letter-spacing: 2px; padding: 8px 12px;
  border-radius: 4px; cursor: pointer;
}
#snd.on { background: var(--g); color: #050a07; }
.title { font-size: 13px; letter-spacing: 9px; color: var(--g2); margin-bottom: 1.5vh; padding-left: 9px; }
svg { width: min(100%, 42vh); height: auto; display: block; margin: 0 auto; overflow: visible; }
.spin { transform-box: view-box; transform-origin: 50% 50%; }
.r1 { animation: spin 60s linear infinite; }
.r2 { animation: spin 40s linear infinite reverse; }
.r3 { animation: spin 120s linear infinite; }
.ring { fill: none; stroke: var(--g2); }
.tick { stroke: var(--dim); stroke-width: 1.6; stroke-linecap: round; }
.tick.five { stroke: var(--g2); stroke-width: 2.6; }
.tick.hot { stroke: var(--g); }
.zone { fill: var(--g); opacity: .1; }
.arc { fill: none; stroke: var(--g); stroke-width: 3; }
.hour { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; }
.min { stroke: var(--g); stroke-width: 3.5; stroke-linecap: round; }
.sec { stroke: var(--fg); stroke-width: 1.2; opacity: .75; }
.hub { fill: #050a07; stroke: var(--g); stroke-width: 2; }
.days {
  font-size: clamp(70px, min(38vw, 19vh), 210px); font-weight: 600; line-height: 1; margin-top: 3vh;
  color: var(--g); font-variant-numeric: lining-nums tabular-nums;
}
.sub { font-size: clamp(13px, min(4.6vw, 2.6vh), 22px); letter-spacing: 8px; color: var(--g2); margin-top: 1.5vh; padding-left: 8px; }
.hms { font-family: var(--mono); font-size: clamp(26px, min(11vw, 7vh), 60px); letter-spacing: 6px; color: var(--fg); margin-top: 2vh; padding-left: 6px; }
.bar { height: 2px; background: var(--dim); margin: 3vh auto 1.5vh; max-width: 240px; }
.bar i { display: block; height: 100%; width: 0; background: var(--g); transition: width .6s; }
.foot { font-family: var(--mono); font-size: 12px; letter-spacing: 3px; color: var(--g2); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<canvas id="leaves"></canvas>
<button id="snd" type="button">🔇 SOUND OFF</button>

<main>
  <p class="title">DOOMSDAY</p>

  <svg viewBox="0 0 400 400" role="img" aria-label="Doomsday clock counting down to 6 February 2027">
    <g class="spin r3"><circle class="ring" cx="200" cy="200" r="196" stroke-width="1" stroke-dasharray="2 10"/></g>
    <g class="spin r2"><circle class="ring" cx="200" cy="200" r="190" stroke-width="2" stroke-dasharray="60 24 6 24" opacity=".5"/></g>
    <g class="spin r1"><circle class="ring" cx="200" cy="200" r="118" stroke-width="1" stroke-dasharray="4 8" opacity=".5"/></g>
    <path class="zone" d="M200 200 L22 200 A178 178 0 0 1 200 22 Z"/>
    <path class="arc" d="M22 200 A178 178 0 0 1 200 22"/>
    <g id="ticks"></g>
    <line class="hour" x1="200" y1="200" x2="200" y2="112"/>
    <line class="min" id="hand" x1="200" y1="200" x2="200" y2="48" transform="rotate(-90 200 200)"/>
    <line class="sec" id="sec" x1="200" y1="226" x2="200" y2="40"/>
    <circle class="hub" cx="200" cy="200" r="8"/>
  </svg>

  <div class="days" id="days">---</div>
  <p class="sub" id="caption">DAYS TO MIDNIGHT</p>
  <p class="hms" id="hms">00:00:00</p>

  <div class="bar"><i id="bar"></i></div>
  <p class="foot" id="foot">GATE 2027 · 06 FEB 2027</p>
</main>

<script>
  // ---------- Countdown ----------
  var target = new Date("2027-02-06T00:00:00+05:30").getTime();
  var start = new Date("2026-10-21T00:00:00+05:30").getTime();
  var total = target - start;
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

  var NS = "http://www.w3.org/2000/svg", tg = $("ticks");
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180, five = i % 5 === 0, r1 = five ? 148 : 158, r2 = 170;
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 200 + r1 * Math.sin(a));
    l.setAttribute("y1", 200 - r1 * Math.cos(a));
    l.setAttribute("x2", 200 + r2 * Math.sin(a));
    l.setAttribute("y2", 200 - r2 * Math.cos(a));
    l.setAttribute("class", "tick" + (five ? " five" : "") + (i === 0 || i >= 45 ? " hot" : ""));
    tg.appendChild(l);
  }

  // ---------- Tick sound (Web Audio, no files) ----------
  var ac = null, soundOn = false, alt = false, bus = null, hasCustom = false;
  // Drop your own sound next to this file as tick.mp3 (or .wav) and it is used automatically.
  var TICK_START = 0, TICK_LEN = 1; // seconds: which part of tick.mp3 plays each second
  var customBuf = null, ct = null;
  var custom = new Audio("tick.mp3");
  custom.addEventListener("canplaythrough", function () { hasCustom = true; });
  function setupBus() {
    var len = ac.sampleRate * 1.6, buf = ac.createBuffer(2, len, ac.sampleRate);
    for (var c = 0; c < 2; c++) { var d = buf.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    var cv2 = ac.createConvolver(); cv2.buffer = buf;
    var wet = ac.createGain(); wet.gain.value = 0.55;
    var comp = ac.createDynamicsCompressor();
    bus = ac.createGain();
    bus.connect(comp); bus.connect(cv2); cv2.connect(wet); wet.connect(comp); comp.connect(ac.destination);
  }
  function playTick() {
    if (!soundOn) return;
    if (customBuf || hasCustom) return; // custom clip plays as a continuous loop
    if (!ac || ac.state !== "running") return;
    var t = ac.currentTime;
    alt = !alt;
    // deep cinematic thud
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(alt ? 95 : 70, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.25);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.95, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.5);
    // metallic clock click
    var n = ac.createBufferSource(), nb = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate), nd = nb.getChannelData(0);
    for (var i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 2);
    n.buffer = nb;
    var f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = alt ? 3200 : 2400; f.Q.value = 6;
    var g2 = ac.createGain(); g2.gain.value = 0.7;
    n.connect(f); f.connect(g2); g2.connect(bus); n.start(t);
    // bell-like ring
    [alt ? 880 : 660, alt ? 1320 : 990].forEach(function (fr, k) {
      var r = ac.createOscillator(), rg = ac.createGain();
      r.type = "sine"; r.frequency.value = fr;
      rg.gain.setValueAtTime(0.0001, t);
      rg.gain.exponentialRampToValueAtTime(0.07 / (k + 1), t + 0.004);
      rg.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      r.connect(rg); rg.connect(bus); r.start(t); r.stop(t + 1);
    });
  }
  var loopSrc = null;
  function msToNextSec() { return 1000 - (Date.now() % 1000); }
  function stopLoop() {
    if (loopSrc) { try { loopSrc.stop(); } catch (e) {} loopSrc = null; }
    custom.pause(); clearTimeout(ct);
  }
  function startLoop() { // whole clip, repeating, first beat on a second boundary
    stopLoop();
    if (!soundOn || !customBuf || !ac) return;
    loopSrc = ac.createBufferSource();
    loopSrc.buffer = customBuf; loopSrc.loop = true;
    loopSrc.connect(ac.destination);
    loopSrc.start(ac.currentTime + msToNextSec() / 1000);
  }
  function startElem() {
    stopLoop(); custom.loop = true; custom.currentTime = 0;
    ct = setTimeout(function () { if (soundOn) custom.play().catch(function () {}); }, msToNextSec());
  }
  $("snd").addEventListener("click", function () {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); setupBus();
      fetch("tick.mp3").then(function (r) { return r.arrayBuffer(); })
        .then(function (b) { ac.decodeAudioData(b, function (d) { customBuf = d; if (soundOn) startLoop(); }); })
        .catch(function () { if (soundOn && hasCustom) startElem(); });
    }
    soundOn = !soundOn;
    if (soundOn) { ac.resume(); if (customBuf) startLoop(); }
    else stopLoop();
    this.classList.toggle("on", soundOn);
    this.textContent = soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
    if (soundOn) playTick();
  });

  // ---------- Render (runs exactly once per countdown second) ----------
  function update() {
    var now = Date.now(), rem = target - now;
    var p = Math.max(0, Math.min(1, (now - start) / total));
    $("hand").setAttribute("transform", "rotate(" + (-90 + p * 90) + " 200 200)");
    $("bar").style.width = (p * 100) + "%";
    var secLeft = rem > 0 ? Math.ceil(rem / 1000) % 60 : 0;
    $("sec").setAttribute("transform", "rotate(" + (-(secLeft / 60) * 360) + " 200 200)");
    if (rem <= 0) {
      $("days").textContent = "0";
      $("caption").textContent = "IT’S MIDNIGHT";
      $("hms").textContent = "00:00:00";
      return;
    }
    var s = Math.ceil(rem / 1000); // whole seconds left
    var d = Math.floor(s / 86400);
    $("days").textContent = d;
    $("caption").textContent = (d === 1 ? "DAY" : "DAYS") + " TO MIDNIGHT";
    $("hms").textContent = pad(Math.floor(s % 86400 / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
    $("foot").textContent = "GATE 2027 · 06 FEB 2027 · " + (p * 100).toFixed(1) + "% GONE";
  }

  // Single sync point: digits, second hand and sound all fire on the same second change.
  var lastSec = -1;
  function syncCheck() {
    var s = Math.ceil((target - Date.now()) / 1000);
    if (s !== lastSec) {
      lastSec = s;
      update();
      if (s > 0) playTick();
    }
  }
  syncCheck();
  setInterval(syncCheck, 100); // keeps running (and ticking) in background tabs

  // ---------- Realistic falling leaves (hi-DPI canvas) ----------
  var cv = $("leaves"), ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rnd = function (a, b) { return a + Math.random() * (b - a); };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  resize();
  addEventListener("resize", resize);

  function makeSprite(hue, sat, lit, blur) {
    var c = document.createElement("canvas");
    c.width = 200; c.height = 320;
    var x = c.getContext("2d");
    if (blur && "filter" in x) x.filter = "blur(" + blur + "px)";
    x.translate(100, 160);
    var w = 74 + rnd(-8, 12), h = 270;
    var hs = function (l, al) { return "hsla(" + hue + "," + sat + "%," + l + "%," + (al == null ? 1 : al) + ")"; };
    function outline() {
      x.beginPath();
      x.moveTo(0, -h / 2);
      x.bezierCurveTo(w * 1.1, -h * 0.28, w * 0.95, h * 0.2, 0, h / 2 - 14);
      x.bezierCurveTo(-w * 0.95, h * 0.2, -w * 1.1, -h * 0.28, 0, -h / 2);
      x.closePath();
    }
    outline();
    var g = x.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, hs(lit - 9));
    g.addColorStop(0.5, hs(lit + 4));
    g.addColorStop(1, hs(lit - 4));
    x.fillStyle = g;
    x.fill();
    x.save();
    x.clip();
    var tip = x.createLinearGradient(0, -h / 2, 0, h / 2);
    tip.addColorStop(0, "hsla(" + (hue + 18) + ",60%," + (lit + 10) + "%,.35)");
    tip.addColorStop(1, "rgba(0,0,0,.25)");
    x.fillStyle = tip;
    x.fillRect(-w * 1.2, -h / 2, w * 2.4, h);
    x.lineCap = "round";
    for (var s = -1; s <= 1; s += 2) {
      for (var k = 0; k < 9; k++) {
        var y0 = -h / 2 + 36 + k * 24;
        x.beginPath();
        x.moveTo(0, y0);
        x.quadraticCurveTo(s * w * 0.45, y0 - 10, s * w * (0.95 - k * 0.05), y0 - 38 + k * 2);
        x.strokeStyle = hs(lit + 14, 0.35);
        x.lineWidth = 1.4;
        x.stroke();
      }
    }
    x.restore();
    x.beginPath();
    x.moveTo(0, h / 2 + 4);
    x.lineTo(0, -h / 2 + 8);
    x.strokeStyle = hs(lit + 16, 0.7);
    x.lineWidth = 3.4;
    x.stroke();
    outline();
    x.strokeStyle = hs(lit - 14, 0.6);
    x.lineWidth = 2;
    x.stroke();
    return c;
  }

  var palettes = [[98, 48, 34], [112, 42, 28], [84, 52, 36], [130, 36, 26], [72, 50, 38]];
  var sharp = palettes.map(function (p) { return makeSprite(p[0], p[1], p[2], 0); });
  var soft = palettes.map(function (p) { return makeSprite(p[0], p[1], p[2], 5); });

  var leaves = [];
  function spawn(l, initial) {
    var z = Math.random();
    l.z = z;
    l.size = 22 + z * z * 90;
    l.x = initial ? rnd(-0.1, 1.1) * W : W + l.size + rnd(0, W * 0.35);
    l.y = rnd(-0.1, 1.05) * H;
    l.vx = -(50 + z * 150 + rnd(0, 40));
    l.vy = 8 + z * 26 + rnd(0, 10);
    l.swayAmp = rnd(14, 40);
    l.swayFreq = rnd(0.6, 1.6);
    l.swayPh = rnd(0, 6.28);
    l.rot = rnd(0, 6.28);
    l.spin = rnd(-1.1, 1.1);
    l.flip = rnd(0, 6.28);
    l.flipSp = rnd(0.8, 2.6);
    l.alpha = 0.5 + z * 0.5;
    var k = (Math.random() * palettes.length) | 0;
    l.spr = (z < 0.28 || z > 0.88) ? soft[k] : sharp[k];
  }
  var count = Math.max(22, Math.min(70, Math.round(W * H / 17000)));
  for (var n = 0; n < count; n++) { var lf = {}; spawn(lf, true); leaves.push(lf); }

  var last = performance.now();
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    syncCheck();
    var wind = 30 * Math.sin(t / 4200) + 14 * Math.sin(t / 1700 + 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < leaves.length; i++) {
      var l = leaves[i];
      if (!reduce) {
        l.swayPh += l.swayFreq * dt;
        l.x += (l.vx + wind * (0.4 + l.z)) * dt;
        l.y += (l.vy + Math.cos(l.swayPh) * l.swayAmp) * dt;
        l.rot += (l.spin + Math.cos(l.swayPh) * 0.5) * dt;
        l.flip += l.flipSp * dt;
        if (l.x < -l.size * 2 || l.y - l.size > H) spawn(l, false);
      }
      var fx = Math.cos(l.flip);
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.scale(Math.max(0.18, Math.abs(fx)), 1);
      ctx.globalAlpha = l.alpha * (0.65 + 0.35 * Math.abs(fx));
      var sw = l.size * 0.625;
      ctx.drawImage(l.spr, -sw / 2, -l.size / 2, sw, l.size);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
